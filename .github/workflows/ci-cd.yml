name: CI-CD

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - 'appli/frontend/**'
      - 'appli/backend/**'
      - '.github/workflows/ci-cd.yml'

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    defaults:
      run:
        working-directory: appli/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: appli/frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    defaults:
      run:
        working-directory: appli/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: appli/backend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Syntax check
        run: node --check src/app.js

      - name: Run tests when configured
        run: |
          if node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); const hasJest=(p.devDependencies && p.devDependencies.jest) || (p.dependencies && p.dependencies.jest); process.exit(hasJest ? 0 : 1);"; then
            npm test
          else
            echo "No Jest dependency detected in package.json, skipping npm test."
          fi
