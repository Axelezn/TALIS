info:
  name: Edit offre
  type: http
  seq: 3

http:
  method: PUT
  url: "{{base_URL}}/api/offres/{{id_offre}}"
  body:
    type: json
    data: |-
      {
        "type": "alternance",
        "titre": "Développeur frontend",
        "date_send": "2026-06-20",
        "date_stop": "2026-08-30",
        "remuneration": 1200,
        "description": "Alternance sur une stack Node.js et React."
      }
  auth: inherit

runtime:
  variables:
    - name: id_offre
      value: "6"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
